# BDD POUR DEV LOCAL
services:
  users-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - users-dev-data:/var/lib/postgresql/data

volumes:
  users-dev-data: {}
