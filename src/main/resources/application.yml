server:
  port: 8081
  servlet:
    context-path: /api/users
spring:
  application:
    name: users
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users}
    username: ${DB_USER:users}
    password: ${DB_PASSWORD:users}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  docker:
    compose:
      lifecycle-management: start-only
app:
  secret-key: ${APP-SECRET-KEY:}
  expiration-time: 9000000

garage:
  endpoint: ${GARAGE_ENDPOINT:http://localhost:3900}
  access-key: ${GARAGE_ACCESS_KEY:GK0123456789abcdef0123456789abcdef}
  secret-key: ${GARAGE_SECRET_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  region-name: garage
  bucket: active